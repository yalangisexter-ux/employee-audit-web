<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Raw Strength · Employee Audit Manager</title>
<style>
:root{--bg:#070b14;--panel:#0f172a;--line:rgba(255,255,255,.08);--text:#f8fafc;--muted:#94a3b8;--accent:#22d3ee;--accent2:#38bdf8;--danger:#fb7185;--ok:#34d399;--sidebar:15.5rem}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100%;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(ellipse at top,#0e7490 0%,#070b14 55%)}
.card{width:100%;max-width:420px;background:rgba(15,23,42,.92);border:1px solid rgba(34,211,238,.25);border-radius:1.25rem;padding:2rem}
.card h1{margin:.25rem 0 0;font-size:1.35rem}.card p.sub{color:var(--muted);margin:.35rem 0 1.25rem;font-size:.9rem}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:.75rem}
input,select,textarea{width:100%;margin-top:.35rem;padding:.7rem .85rem;border-radius:.65rem;border:1px solid var(--line);background:#0b1220;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1rem;border-radius:.7rem;border:1px solid transparent;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#042f2e;font-weight:700}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}.btn.danger{background:#7f1d1d;color:#fecaca;border-color:#991b1b}
.err{background:rgba(127,29,29,.5);border:1px solid rgba(251,113,133,.3);color:#fecaca;padding:.75rem;border-radius:.65rem;margin-bottom:1rem;font-size:.9rem}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);background:#0b1220;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:.6rem}
.brand{padding:.65rem .75rem;font-weight:800;color:var(--accent);font-size:.9rem;line-height:1.25}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.68rem;margin-top:.15rem}
.nav{flex:1;overflow:auto;margin-top:.35rem}
.nav button{width:100%;text-align:left;padding:.55rem .75rem;margin-bottom:.15rem;border-radius:.55rem;border:0;background:transparent;color:var(--muted);font-size:.84rem}
.nav button.active,.nav button:hover{background:rgba(34,211,238,.12);color:var(--text)}
.side-foot{padding:.65rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.15rem;border-bottom:1px solid var(--line);background:rgba(15,23,42,.75)}
.top h2{margin:0;font-size:1.05rem}.content{flex:1;overflow:auto;padding:1.1rem}
.grid{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.guide{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:.75rem}
.guide .panel{cursor:pointer}.guide .panel:hover{border-color:rgba(34,211,238,.45)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.9rem}
.kpi .n{font-size:1.45rem;font-weight:800;color:var(--accent)}.kpi .l{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:.85rem}
.panel h3{margin:0 0 .65rem;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem;align-items:end}
.row label{margin:0;flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{text-align:left;padding:.5rem .45rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.68rem;text-transform:uppercase}
.muted{color:var(--muted)}.ok{color:var(--ok)}
.tabs{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.85rem}
.tabs button{padding:.4rem .75rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.78rem}
.tabs button.active{background:rgba(34,211,238,.15);color:var(--accent);border-color:rgba(34,211,238,.35)}
.menu-btn{display:none;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:.5rem;padding:.35rem .55rem}
@media(max-width:900px){.sidebar{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:none}.menu-btn{display:inline-flex}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}.overlay.show{display:block}}
.empty{text-align:center;padding:1.75rem;color:var(--muted);font-size:.88rem}
.pw-wrap{display:flex;gap:.4rem;align-items:center}.pw-wrap input{flex:1}
.banner{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:.85rem 1rem;border:1px solid var(--line);border-radius:1rem;background:linear-gradient(135deg,rgba(14,116,144,.25),rgba(15,23,42,.9));margin-bottom:1rem}
.badge{display:inline-block;padding:.15rem .45rem;border-radius:.4rem;background:rgba(34,211,238,.15);color:var(--accent);font-size:.7rem;font-weight:700}
</style>
</head>
<body>
<div id="root"></div>
<script>
const state={token:localStorage.getItem('eaw_token')||'',user:null,tab:'home',bizTab:'orders',notice:'',error:'',data:{},loading:true,showPw:false,trackerEmp:''};
const NAV=[['home','Home'],['dashboard','Dashboard'],['employees','Employees'],['tasks','Task Manager'],['tracker','Employee Tracker'],['attendance','Attendance'],['print','Print Center'],['eod','EOD Archive'],['business','Business Tracking'],['store','Store Directory'],['chat','Live Chat'],['settings','Settings & Backup']];
async function api(path,opts={}){const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(state.token)headers['Authorization']='Bearer '+state.token;const res=await fetch(path,Object.assign({},opts,{headers}));if(res.status===401){state.token='';state.user=null;localStorage.removeItem('eaw_token');const err=new Error('AUTH_REQUIRED');err.code='AUTH_REQUIRED';throw err;}const text=await res.text();let body=null;try{body=text?JSON.parse(text):null;}catch{body=text;}if(!res.ok)throw new Error((body&&body.detail)?(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail)):res.statusText);return body;}
function notice(msg){state.notice=msg;setTimeout(()=>{state.notice='';render();},2500);render();}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
async function bootstrap(){state.loading=true;state.error='';render();try{if(state.token){state.user=await api('/api/auth/me');if(state.user)await loadTab();}}catch(e){state.token='';state.user=null;localStorage.removeItem('eaw_token');state.error='';}finally{state.loading=false;render();}}
async function login(e){e.preventDefault();state.error='';const fd=new FormData(e.target);try{const out=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:fd.get('username'),password:fd.get('password')})});state.token=out.token;state.user=out.user;localStorage.setItem('eaw_token',out.token);state.tab='home';await loadTab();}catch(err){state.error=(err&&err.code==='AUTH_REQUIRED')?'Invalid username or password':(err.message||'Login failed');}render();}
async function changePassword(e){e.preventDefault();const fd=new FormData(e.target);try{const out=await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:fd.get('current_password'),new_password:fd.get('new_password')})});if(out.token){state.token=out.token;localStorage.setItem('eaw_token',out.token);}notice('Password updated');e.target.reset();}catch(err){alert(err.message);}}
async function resetUserPassword(e){e.preventDefault();const fd=new FormData(e.target);const userId=Number(fd.get('user_id'));const newPassword=String(fd.get('new_password')||'');if(!userId||newPassword.length<12){alert('Select an account and enter a password with at least 12 characters.');return;}if(!confirm('Reset this account password? Its existing sessions will be invalidated.'))return;try{const out=await api('/api/users/'+userId+'/reset-password',{method:'POST',body:JSON.stringify({new_password:newPassword})});notice(out.message||'Password reset');e.target.reset();}catch(err){alert('Password reset failed: '+err.message);}}
async function downloadBackup(){try{const res=await fetch('/api/backup/database',{headers:{Authorization:'Bearer '+state.token}});if(!res.ok)throw new Error(await res.text());const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='employee-audit-web-backup.db';a.click();notice('Backup downloaded');}catch(err){alert('Backup failed: '+err.message);}}
function logout(){state.token='';state.user=null;localStorage.removeItem('eaw_token');render();}
async function loadTab(){const t=state.tab;try{
if(t==='home'||t==='dashboard')state.data.dashboard=await api('/api/dashboard');
if(t==='employees'||t==='tracker')state.data.employees=await api('/api/employees');
if(t==='tasks'||t==='tracker'||t==='eod')state.data.tasks=await api('/api/tasks');
if(t==='attendance'||t==='eod')state.data.attendance=await api('/api/attendance');
if(t==='business'){state.data.products=await api('/api/business/products');state.data.services=await api('/api/business/services');state.data.orders=await api('/api/business/orders');state.data.members=await api('/api/business/members');state.data.activities=await api('/api/business/activities');}
if(t==='store')state.data.customers=await api('/api/customers');
if(t==='print'||t==='eod'){try{state.data.print=await api('/api/print/summary');}catch(_){state.data.print={};}}
if(t==='settings')state.data.settings=await api('/api/settings');
}catch(e){state.error=e.message;}render();}
async function setTab(tab){state.tab=tab;state.error='';document.querySelector('.sidebar')?.classList.remove('open');document.querySelector('.overlay')?.classList.remove('show');render();await loadTab();}
async function createRow(path,body){await api(path,{method:'POST',body:JSON.stringify(body)});notice('Saved');await loadTab();}
async function removeRow(path){if(!confirm('Delete this record?'))return;try{await api(path,{method:'DELETE'});notice('Deleted');await loadTab();}catch(err){alert(err.message);}}
async function editRow(base,id){const map={'/api/employees':'employees','/api/tasks':'tasks','/api/attendance':'attendance','/api/business/products':'products','/api/business/services':'services','/api/business/orders':'orders','/api/business/members':'members','/api/business/activities':'activities','/api/customers':'customers'};const key=map[base];const row=(state.data[key]||[]).find(x=>Number(x.id)===Number(id));if(!row)return alert('Record not found');const updated={...row};delete updated.id;delete updated.created_at;delete updated.updated_at;for(const field of Object.keys(updated)){const value=prompt('Edit '+field.replace(/_/g,' ')+':',updated[field]??'');if(value===null)return;if(['stock','price','duration_min','quantity','amount','employee_id'].includes(field)){if(value.trim()==='')updated[field]=field==='employee_id'?null:0;else if(!Number.isFinite(Number(value)))return alert(field+' must be a number');else updated[field]=Number(value);}else updated[field]=value;}try{await api(base+'/'+id,{method:'PUT',body:JSON.stringify(updated)});notice('Updated');await loadTab();}catch(err){alert('Update failed: '+err.message);}}
function exportCsv(name,rows){if(!rows||!rows.length){alert('No rows to export');return;}const cols=Object.keys(rows[0]);const lines=[cols.join(',')].concat(rows.map(r=>cols.map(c=>{const v=r[c]==null?'':String(r[c]);return '"'+v.replace(/"/g,'""')+'"';}).join(',')));const blob=new Blob([lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
function kpi(n,l){return `<div class="kpi"><div class="n">${n??0}</div><div class="l">${l}</div></div>`;}
function table(rows,cols,delPath){if(!rows||!rows.length)return `<div class="empty">No records yet. Use the form above to add the first one.</div>`;return `<div style="overflow:auto"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}${delPath?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]]??'—')}</td>`).join('')}${delPath?`<td style="white-space:nowrap"><button class="btn ghost" style="padding:.2rem .45rem;font-size:.72rem" onclick="editRow('${delPath}',${r.id})">Edit</button> <button class="btn danger" style="padding:.2rem .45rem;font-size:.72rem" onclick="removeRow('${delPath}/'+${r.id})">Delete</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;}
function formFields(fields,submitLabel,onSubmitName){return `<form onsubmit="${onSubmitName}(event)" class="row">${fields.map(f=>{if(f.type==='select')return `<label>${f.label}<select name="${f.name}">${f.options.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>`;return `<label>${f.label}<input name="${f.name}" ${f.required?'required':''} value="${f.value||''}" type="${f.type||'text'}"/></label>`;}).join('')}<button class="btn" type="submit">${submitLabel}</button></form>`;}
async function submitEmployee(e){e.preventDefault();const fd=new FormData(e.target);await createRow('/api/employees',Object.fromEntries(fd.entries()));e.target.reset();}
async function submitTask(e){e.preventDefault();const fd=new FormData(e.target);await createRow('/api/tasks',Object.fromEntries(fd.entries()));e.target.reset();}
async function submitAttendance(e){e.preventDefault();const fd=new FormData(e.target);await createRow('/api/attendance',Object.fromEntries(fd.entries()));e.target.reset();}
async function submitProduct(e){e.preventDefault();const fd=new FormData(e.target);const o=Object.fromEntries(fd.entries());o.stock=+o.stock||0;o.price=+o.price||0;await createRow('/api/business/products',o);e.target.reset();}
async function submitService(e){e.preventDefault();const fd=new FormData(e.target);const o=Object.fromEntries(fd.entries());o.price=+o.price||0;o.duration_min=+o.duration_min||0;await createRow('/api/business/services',o);e.target.reset();}
async function submitOrder(e){e.preventDefault();const fd=new FormData(e.target);const o=Object.fromEntries(fd.entries());o.quantity=+o.quantity||1;o.amount=+o.amount||0;await createRow('/api/business/orders',o);e.target.reset();}
async function submitMember(e){e.preventDefault();const fd=new FormData(e.target);await createRow('/api/business/members',Object.fromEntries(fd.entries()));e.target.reset();}
async function submitActivity(e){e.preventDefault();const fd=new FormData(e.target);await createRow('/api/business/activities',Object.fromEntries(fd.entries()));e.target.reset();}
async function submitCustomer(e){e.preventDefault();const fd=new FormData(e.target);await createRow('/api/customers',Object.fromEntries(fd.entries()));e.target.reset();}
function viewHome(){const d=state.data.dashboard||{};const u=state.user||{};const role=u.is_developer?'Developer':(u.is_customer?'Customer':'User');
return `<div class="banner"><div><strong>RAW STRENGTH CALISTHENICS</strong><div class="muted" style="font-size:.78rem;margin-top:.2rem">Executive Audit · Operations OS · Web</div><div style="margin-top:.55rem;font-size:.85rem">Signed in <strong>${esc(u.display_name||u.username||'')}</strong> · <span class="badge">${esc(role)}</span> · <code>${esc(u.username||'')}</code></div><div class="muted" style="font-size:.75rem;margin-top:.35rem">Web DB is independent of the desktop EXE until cloud sync is enabled.</div></div><div class="muted" style="font-size:.8rem">${new Date().toLocaleString()}</div></div><div class="grid">${kpi(d.employees,'Employees')}${kpi(d.tasks_open,'Open tasks')}${kpi(d.tasks_total,'Total tasks')}${kpi(d.attendance_today,'Attendance today')}${kpi(d.orders_open,'Open orders')}${kpi(d.members,'Members')}${kpi(d.customers,'Customers')}</div><h3 style="margin:1.25rem 0 .35rem;font-size:.95rem">Workspace guide</h3><div class="guide">${[['dashboard','Dashboard','Totals and activity counts'],['employees','Employees','Add/edit staff records'],['tasks','Task Manager','Create and track tasks'],['tracker','Employee Tracker','Filter tasks by person'],['attendance','Attendance','Present / leave / times'],['print','Print Center','Print or CSV export'],['eod','EOD Archive','End-of-day snapshot'],['business','Business Tracking','Orders, stock, members'],['store','Store Directory','Customers and stores'],['settings','Settings & Backup','Password and DB backup']].map(([id,t,d])=>`<div class="panel" onclick="setTab('${id}')"><h3>${t}</h3><p class="muted" style="font-size:.8rem;margin:0">${d}</p></div>`).join('')}</div>`;}
function viewDashboard(){const d=state.data.dashboard||{};return `<div class="grid">${kpi(d.employees,'Employees')}${kpi(d.tasks_open,'Open tasks')}${kpi(d.tasks_total,'Total tasks')}${kpi(d.attendance_today,'Attendance today')}${kpi(d.orders_open,'Open orders')}${kpi(d.members,'Members')}${kpi(d.customers,'Customers')}${kpi(d.products,'Products')}${kpi(d.services,'Services')}</div><div class="panel" style="margin-top:1rem"><h3>Signed in as</h3><p><strong>${esc(d.user||state.user?.display_name||'')}</strong> · <code>${esc(d.username||state.user?.username||'')}</code></p></div>`;}
function viewEmployees(){return `<div class="panel"><h3>Add employee</h3>${formFields([{name:'name',label:'Name',required:true},{name:'role',label:'Role'},{name:'phone',label:'Phone'},{name:'email',label:'Email'},{name:'status',label:'Status',type:'select',options:[['Active','Active'],['Inactive','Inactive']]}],'Add employee','submitEmployee')}</div><div class="panel"><h3>Employees</h3>${table(state.data.employees,[['name','Name'],['role','Role'],['phone','Phone'],['email','Email'],['status','Status']],' /api/employees'.replace(/\s/g,''))}</div>`;}
function viewTasks(){return `<div class="panel"><h3>Add task</h3>${formFields([{name:'title',label:'Title',required:true},{name:'assignee',label:'Assignee'},{name:'priority',label:'Priority',type:'select',options:[['Low','Low'],['Normal','Normal'],['High','High']]},{name:'status',label:'Status',type:'select',options:[['Open','Open'],['In Progress','In Progress'],['Done','Done']]},{name:'due_date',label:'Due date',type:'date'}],'Add task','submitTask')}</div><div class="panel"><h3>Tasks</h3>${table(state.data.tasks,[['title','Title'],['assignee','Assignee'],['priority','Priority'],['status','Status'],['due_date','Due']],' /api/tasks'.replace(/\s/g,''))}</div>`;}
function viewTracker(){const emp=state.trackerEmp||'';const tasks=(state.data.tasks||[]).filter(t=>!emp||String(t.assignee||'').toLowerCase().includes(emp.toLowerCase()));const emps=[...new Set((state.data.employees||[]).map(e=>e.name).filter(Boolean))];return `<div class="panel"><h3>Employee Tracker</h3><p class="muted" style="font-size:.82rem">Filter tasks by employee (read-only overview).</p><div class="row"><label>Employee<input list="emp-list" value="${esc(emp)}" oninput="state.trackerEmp=this.value;render()" placeholder="Type name"/></label><datalist id="emp-list">${emps.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist><button class="btn ghost" type="button" onclick="state.trackerEmp='';render()">Clear</button></div></div><div class="panel"><h3>Tasks ${emp?('for '+esc(emp)):'(all)'}</h3>${table(tasks,[['title','Title'],['assignee','Assignee'],['status','Status'],['priority','Priority'],['due_date','Due']])}</div>`;}
function viewAttendance(){const today=new Date().toISOString().slice(0,10);return `<div class="panel"><h3>Mark attendance</h3>${formFields([{name:'employee_name',label:'Employee name',required:true},{name:'work_date',label:'Date',type:'date',value:today,required:true},{name:'status',label:'Status',type:'select',options:[['Present','Present'],['Absent','Absent'],['Leave','Leave'],['Half Day','Half Day']]},{name:'check_in',label:'Check in'},{name:'check_out',label:'Check out'}],'Save','submitAttendance')}</div><div class="panel"><h3>Attendance</h3>${table(state.data.attendance,[['employee_name','Employee'],['work_date','Date'],['status','Status'],['check_in','In'],['check_out','Out']],' /api/attendance'.replace(/\s/g,''))}</div>`;}
function viewBusiness(){const t=state.bizTab;const tabs=[['orders','Orders'],['products','Products'],['services','Services'],['members','Members'],['activities','Activities']];let body='';
if(t==='orders')body=`<div class="panel"><h3>New order</h3>${formFields([{name:'customer_name',label:'Customer',required:true},{name:'item',label:'Item',required:true},{name:'quantity',label:'Qty',type:'number',value:'1'},{name:'amount',label:'Amount',type:'number'},{name:'status',label:'Status',type:'select',options:[['Pending','Pending'],['Paid','Paid'],['Completed','Completed'],['Cancelled','Cancelled']]}],'Add order','submitOrder')}</div><div class="panel">${table(state.data.orders,[['customer_name','Customer'],['item','Item'],['quantity','Qty'],['amount','Amount'],['status','Status'],['order_date','Date']],' /api/business/orders'.replace(/\s/g,''))}</div>`;
if(t==='products')body=`<div class="panel"><h3>Add product</h3>${formFields([{name:'name',label:'Name',required:true},{name:'sku',label:'SKU'},{name:'category',label:'Category'},{name:'stock',label:'Stock',type:'number',value:'0'},{name:'price',label:'Price',type:'number',value:'0'}],'Add product','submitProduct')}</div><div class="panel">${table(state.data.products,[['name','Name'],['sku','SKU'],['category','Category'],['stock','Stock'],['price','Price']],' /api/business/products'.replace(/\s/g,''))}</div>`;
if(t==='services')body=`<div class="panel"><h3>Add service</h3>${formFields([{name:'name',label:'Name',required:true},{name:'category',label:'Category'},{name:'price',label:'Price',type:'number'},{name:'duration_min',label:'Minutes',type:'number'}],'Add service','submitService')}</div><div class="panel">${table(state.data.services,[['name','Name'],['category','Category'],['price','Price'],['duration_min','Minutes']],' /api/business/services'.replace(/\s/g,''))}</div>`;
if(t==='members')body=`<div class="panel"><h3>Add member</h3>${formFields([{name:'name',label:'Name',required:true},{name:'phone',label:'Phone'},{name:'plan',label:'Plan'},{name:'status',label:'Status',type:'select',options:[['Active','Active'],['Expired','Expired'],['Paused','Paused']]}],'Add member','submitMember')}</div><div class="panel">${table(state.data.members,[['name','Name'],['phone','Phone'],['plan','Plan'],['status','Status']],' /api/business/members'.replace(/\s/g,''))}</div>`;
if(t==='activities')body=`<div class="panel"><h3>Log activity</h3>${formFields([{name:'title',label:'Title',required:true},{name:'category',label:'Category'},{name:'employee_name',label:'Employee'},{name:'activity_date',label:'Date',type:'date'}],'Add activity','submitActivity')}</div><div class="panel">${table(state.data.activities,[['title','Title'],['category','Category'],['employee_name','Employee'],['activity_date','Date']],' /api/business/activities'.replace(/\s/g,''))}</div>`;
return `<div class="tabs">${tabs.map(([id,lab])=>`<button class="${t===id?'active':''}" onclick="state.bizTab='${id}';render()">${lab}</button>`).join('')}</div>${body}`;}
function viewStore(){return `<div class="panel"><h3>Add store / customer / prospect</h3>${formFields([{name:'business_name',label:'Business / store name',required:true},{name:'contact_name',label:'Contact'},{name:'phone',label:'Phone'},{name:'email',label:'Email'},{name:'city',label:'City'},{name:'state',label:'State'},{name:'kind',label:'Kind',type:'select',options:[['Prospect','Prospect'],['Customer','Customer'],['Retailer','Retailer'],['Store','Store']]},{name:'status',label:'Status',type:'select',options:[['New','New'],['Contacted','Contacted'],['Qualified','Qualified'],['Closed','Closed']]}],'Add','submitCustomer')}</div><div class="panel"><h3>Store Directory</h3>${table(state.data.customers,[['business_name','Business'],['contact_name','Contact'],['phone','Phone'],['city','City'],['kind','Kind'],['status','Status']],' /api/customers'.replace(/\s/g,''))}</div>`;}
function viewPrint(){const p=state.data.print||{};const section=(title,key,cols)=>`<div class="panel"><h3>${title}</h3><div class="row"><button class="btn ghost" onclick="exportCsv('${key}',(state.data.print||{}).${key}||[])">Export CSV</button></div>${table(p[key],cols)}</div>`;return `<div class="panel"><h3>Print Center</h3><p class="muted">Generated ${esc(p.generated_at||'—')}. Use browser Print for PDF.</p><div class="row"><button class="btn" onclick="window.print()">Print / Save PDF</button></div></div>${section('Employees','employees',[['name','Name'],['role','Role'],['status','Status']])}${section('Tasks','tasks',[['title','Title'],['assignee','Assignee'],['status','Status'],['due_date','Due']])}${section('Attendance','attendance',[['employee_name','Employee'],['work_date','Date'],['status','Status'],['check_in','In'],['check_out','Out']])}${section('Products','products',[['name','Product'],['sku','SKU'],['category','Category'],['stock','Stock'],['price','Price']])}${section('Services','services',[['name','Service'],['category','Category'],['price','Price'],['duration_min','Minutes']])}${section('Orders','orders',[['customer_name','Customer'],['item','Item'],['quantity','Qty'],['amount','Amount'],['status','Status'],['order_date','Date']])}${section('Members','members',[['name','Name'],['phone','Phone'],['plan','Plan'],['status','Status'],['start_date','Start']])}${section('Customers / Stores','customers',[['business_name','Business'],['contact_name','Contact'],['phone','Phone'],['city','City'],['kind','Kind'],['status','Status']])}${section('Activities','activities',[['title','Activity'],['category','Category'],['employee_name','Employee'],['activity_date','Date']])}`;}
function viewEod(){const tasks=state.data.tasks||[];const att=state.data.attendance||[];const open=tasks.filter(t=>!['Done','Closed','Completed'].includes(t.status));return `<div class="panel"><h3>EOD Archive</h3><p class="muted">End-of-day snapshot. Desktop EOD PDF templates remain on the EXE.</p><button class="btn" onclick="window.print()">Print this snapshot</button></div><div class="panel"><h3>Open / in-progress tasks (${open.length})</h3>${table(open,[['title','Title'],['assignee','Assignee'],['status','Status'],['priority','Priority']])}</div><div class="panel"><h3>Recent attendance</h3>${table(att.slice(0,50),[['employee_name','Employee'],['work_date','Date'],['status','Status'],['check_in','In'],['check_out','Out']])}</div>`;}
function viewChat(){return `<div class="panel"><h3>Live Chat</h3><p class="muted">Desktop Live Chat uses a separate Cloudflare service with its own accounts — not the Audit Manager login.</p><p>Web focus is audit operations. Chat remains an external linked service.</p></div>`;}
function viewSettings(){const s=state.data.settings||{};const u=s.user||state.user||{};return `<div class="panel"><h3>Account</h3><p><strong>${esc(u.display_name||'')}</strong></p><p>Username: <code>${esc(u.username||'')}</code></p><p class="muted">Customer: ${u.is_customer?'yes':'no'} · Developer: ${u.is_developer?'yes':'no'}</p></div><div class="panel"><h3>Change password</h3><form class="row" onsubmit="changePassword(event)"><label>Current<input name="current_password" type="password" required autocomplete="current-password"/></label><label>New (min 12 chars)<input name="new_password" type="password" minlength="12" required autocomplete="new-password"/></label><button class="btn" type="submit">Update password</button></form></div>${(u.is_customer||u.is_developer)&&Array.isArray(s.users)?`<div class="panel"><h3>Administrator · Reset user password</h3><form class="row" onsubmit="resetUserPassword(event)"><label>Account<select name="user_id" required>${s.users.filter(x=>x.is_active).map(x=>`<option value="${x.id}">${esc(x.username)} · ${esc(x.role)}</option>`).join('')}</select></label><label>New password (min 12 chars)<input name="new_password" type="password" minlength="12" required autocomplete="new-password"/></label><button class="btn" type="submit">Reset password</button></form></div>`:''}<div class="panel"><h3>Cloud Sync · EXE / Mobile</h3><p class="muted">Pull an encrypted customer snapshot. Replacing records is restricted to authorized administrators and creates a server-side backup first.</p><div class="row"><label>Installation ID<input id="syncInstallId" autocomplete="off"/></label><label>Sync Secret<input id="syncSecret" type="password" autocomplete="off"/></label></div><button class="btn" type="button" onclick="pullCloudSync()">Pull encrypted snapshot</button><p id="syncStatus" class="muted" role="status"></p></div><div class="panel"><h3>System</h3><p class="muted">App version: ${esc(s.app_version||'2.2.0')}</p></div><div class="panel"><h3>Backup</h3><p class="muted">Download this web instance SQLite database.</p><button class="btn" type="button" onclick="downloadBackup()">Download database backup</button></div>`;}
const VIEWS={home:viewHome,dashboard:viewDashboard,employees:viewEmployees,tasks:viewTasks,tracker:viewTracker,attendance:viewAttendance,business:viewBusiness,store:viewStore,print:viewPrint,eod:viewEod,chat:viewChat,settings:viewSettings};
function render(){const root=document.getElementById('root');if(state.loading){root.innerHTML=`<div class="login"><p style="color:var(--accent)">Loading…</p></div>`;return;}if(!state.user){root.innerHTML=`<div class="login"><form class="card" onsubmit="login(event)"><div style="font-size:2rem">🏋️</div><h1>Raw Strength Calisthenics</h1><p class="sub">Employee Audit Manager · Web</p>${state.error?`<div class="err">${esc(state.error)}</div>`:''}<label>Username<input name="username" required autocomplete="username"/></label><label>Password<div class="pw-wrap"><input name="password" type="${state.showPw?'text':'password'}" required/><button type="button" class="btn ghost" onclick="state.showPw=!state.showPw;render()">${state.showPw?'Hide':'Show'}</button></div></label><button class="btn" style="width:100%;margin-top:.5rem" type="submit">Sign in</button><p class="muted" style="margin-top:1rem;font-size:.75rem">Case-sensitive usernames. Contact your administrator if you need account access.</p></form></div>`;return;}
const titles=Object.fromEntries(NAV);const body=(VIEWS[state.tab]||viewHome)();
root.innerHTML=`<div class="overlay" onclick="this.classList.remove('show');document.querySelector('.sidebar').classList.remove('open')"></div><div class="app"><aside class="sidebar"><div class="brand">RAW STRENGTH<small>Employee Audit · Web</small></div><nav class="nav">${NAV.map(([id,lab])=>`<button class="${state.tab===id?'active':''}" onclick="setTab('${id}')">${lab}</button>`).join('')}</nav><div class="side-foot"><div>${esc(state.user.display_name||state.user.username)}</div><div>${esc(state.user.username)}</div><button class="btn ghost" style="width:100%;margin-top:.5rem;font-size:.78rem" onclick="logout()">Sign out</button></div></aside><div class="main"><div class="top"><div style="display:flex;gap:.5rem;align-items:center"><button class="menu-btn" onclick="document.querySelector('.sidebar').classList.add('open');document.querySelector('.overlay').classList.add('show')">☰</button><h2>${titles[state.tab]||''}</h2></div>${state.notice?`<span class="ok">${esc(state.notice)}</span>`:''}</div><div class="content">${state.error?`<div class="err">${esc(state.error)}</div>`:''}${body}</div></div></div>`;}
bootstrap();
</script>
<script src="/cloud-sync.js"></script>
</body>
</html>
