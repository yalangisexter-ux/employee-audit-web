services:
  - type: web
    name: employee-audit-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: WEB_BOOTSTRAP_USERS
        value: "true"
      - key: WEB_ADMIN_USERNAME
        sync: false
      - key: WEB_ADMIN_PASSWORD
        sync: false
      - key: WEB_ADMIN_DISPLAY_NAME
        value: "Account Administrator"
      - key: WEB_DEVELOPER_USERNAME
        sync: false
      - key: WEB_DEVELOPER_PASSWORD
        sync: false
